name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        run: pip install -e ".[dev]"

      # Fail closed. A green check must mean "the tests ran and passed", never
      # "no tests ran". A rename, a bad testpaths, or an import error in a
      # conftest can all empty the collection, and a suite that collects
      # nothing exits successfully by default — the most dangerous shade of
      # green there is, because the signal that would have caught it is the
      # signal that disappeared.
      #
      # pytest exits 5 on an empty collection. That is caught explicitly
      # rather than left to bubble up as a generic non-zero, so the log says
      # what actually happened instead of leaving someone to guess.
      - name: Run the test suite
        run: |
          set +e
          python -m pytest -q
          status=$?
          set -e

          if [ "$status" -eq 5 ]; then
            echo "::error::pytest collected zero tests — refusing to pass."
            exit 1
          fi

          exit "$status"

  # The distribution is a separate artifact from the working tree, and every
  # failure this job catches is invisible to the test suite: the tests import
  # from a source checkout, so a file that never reaches the wheel passes them
  # all and breaks only for the people who install the package.
  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the build tooling
        run: pip install build twine

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the distribution metadata
        run: twine check dist/*

      - name: Check the wheel ships its markers
        run: |
          wheel=$(ls dist/*.whl)
          contents=$(python -m zipfile -l "$wheel")

          # PEP 561: without this marker inside the package, every downstream
          # type checker ignores the library's annotations. It is one empty
          # file and one line of packaging config, and nothing else in the
          # repo fails when it goes missing.
          if ! grep -q 'ledger_core/py.typed' <<<"$contents"; then
            echo "::error::py.typed is missing from the wheel — annotations will be ignored downstream."
            exit 1
          fi

          # setuptools moved the license from .dist-info/ into
          # .dist-info/licenses/ in 77; accept either so a toolchain bump does
          # not fail this for the wrong reason.
          if ! grep -qE 'dist-info/(licenses/)?LICENSE' <<<"$contents"; then
            echo "::error::LICENSE is missing from the wheel."
            exit 1
          fi
