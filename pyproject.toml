[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name, not the import name — `import ledger_core` is
# unchanged. "ledger-core" collides with the existing `ledgercore` on PyPI:
# the similarity check strips separators before comparing, so every
# punctuation variant of it collides too.
name = "ledger-tieout"
version = "0.1.0"
description = "Transactions in, a double-entry journal out — or a report of exactly what doesn't balance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["accounting", "double-entry", "bookkeeping", "journal", "reconciliation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

# Deliberately empty, and worth keeping that way. The library holds no state
# and does no I/O (§7); the Stripe adapter takes a plain mapping rather than
# importing the Stripe SDK, so nothing here needs a dependency to stay true.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["ledger_core*"]

# The PEP 561 marker has to be listed here to reach the wheel. Without it the
# library ships fully annotated and every downstream type checker ignores the
# annotations, which is the same as not having written them. CI asserts the
# file is actually present in the built wheel rather than trusting this.
[tool.setuptools.package-data]
ledger_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Wide enough for the aligned assertion messages this suite is written with,
# narrow enough to keep a line readable in a diff view.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Selected explicitly rather than left to the default set, which moves between
# ruff releases — a linter whose rules change under you fails a green branch
# for reasons nobody in the repo chose.
#
# FURB is deliberately absent. It rewrites `fee if fee > 0 else 0` to
# `max(0, fee)`, and in entries.py that expression is one half of a
# debit/credit pair written to mirror its other half; the shorter spelling
# reads better in isolation and worse in the ledger.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
# The library only. The test suite is deliberately unannotated — assertions
# about data shapes are the point of it — and running a strict checker over it
# would buy annotations on 60 fixtures and no additional safety.
files = ["ledger_core"]
strict = true
